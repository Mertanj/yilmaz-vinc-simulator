<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D98A0B">
<title>Yılmaz Vinç</title>
<meta name="description" content="Yılmaz Vinç mobil vinç simülasyonu. Tarayıcıda hemen oyna.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html { overscroll-behavior: none; }
  html, body { margin: 0; height: 100%; background: #0E1417; overflow: hidden; }
  body, #game {
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Ölçü sorgularının baktığı kap. `container-type: size` hem sorguları
     mümkün kılıyor hem de içindeki `position: fixed` katmanları bu kaba
     bağlıyor. */
  #sahne {
    position: fixed; inset: 0;
    container-type: size; container-name: sahne;
    /* Alçak ekran yerleşiminin iki ölçüsü. Kabın KENDİSİNDE tanımlılar,
       ölçü sorgusunun içinde değil: kapsayıcı sorgusu yalnızca kabın
       TORUNLARINA uyguluyor, `:root` ise onun atası — orada tanımlanan
       değişken hiç var olmuyor, `calc()` sessizce geçersiz oluyor ve panel
       içeriğine göre büzülüyordu. */
    /* Yalnizca yatay telefon blogu kullaniyor (panel genisligi + ipucu ve
       uyari seritlerinin sol hizasi). Masaustu 268, tablet 200 kendi
       genisligini yaziyor. 188'den 158'e indi: sahadan "sol menu ekrani
       kapliyor" geldi ve olcum 844x390'da paneli 188x178 (yuksekligin
       %46'si) gosterdi. */
    --panel-en: 158px;
    --yardimci-en: 195px;
  }
  /* --- zorlanmış yatay ---
     Sahadan: "telefonda main'den denediğimde yataya dönmüyor yine." Telefonun
     döndürme kilidi açıkken tarayıcı yatayı hiç görmüyor; `screen.orientation
     .lock()` ise tam ekran istiyor ve iOS'ta hiç yok. Kalan dürüst yol oyunu
     KENDİMİZİN çevirmesi: kap 90° dönüyor, en ve boy yer değiştiriyor,
     oyuncu telefonu fiziksel olarak çeviriyor. Her tarayıcıda çalışıyor,
     izin istemiyor, tek kod yolu. */
  body.yatay-zorla #sahne {
    inset: auto; top: 0; left: 0;
    width: 100vh; height: 100vw;
    transform-origin: 0 0;
    transform: translateX(100vw) rotate(90deg);
  }
  #game { position: absolute; inset: 0; }
  /* --- üst şerit: kim, hangi görev, ne kadar süre, kaç puan --- */
  #ust {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
    color: #C7D1D6; background: linear-gradient(#0E1417E0, #0E141700);
  }
  #ust b { color: #E8A62C; font-weight: 600; letter-spacing: 0.06em; }
  /* Tam Tur'da kaçıncı ayakta olduğun — makine adının hemen yanında,
     görevden önce: sıra makine > ayak > görev, genişten dara. */
  #ayak {
    color: #16191B; background: #E8A62C; border-radius: 3px;
    padding: 1px 7px; font-weight: 600; letter-spacing: 0.06em; font-size: 11.5px;
  }
  #ayak[hidden] { display: none; }
  /* El değiştirme kartındaki rekor farkı. */
  #sonuc-ic .rekor-fark {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 15px; font-weight: 600; margin: 0 0 12px;
    font-variant-numeric: tabular-nums;
  }
  #sonuc-ic .rekor-fark[data-iyi="evet"] { color: #5FB07C; }
  #sonuc-ic .rekor-fark[data-iyi="hayir"] { color: #E2645A; }
  #sonuc-ic .rekor-fark[data-iyi="esit"] { color: #8E9BA2; }
  #gorev { color: #E4E9EB; white-space: nowrap; }
  #gorev-brif { color: #8E9BA2; }
  #sayac { margin-left: auto; color: #8E9BA2; white-space: nowrap; }
  #puan { color: #E8A62C; font-weight: 600; }

  /* --- sol panel: vinçin göstergesi --- */
  /*
     Eskiden bütün bilgi üstte tek satırda, 12 punto, kısaltmalarla akıyordu
     ("LMI %78 · kap 4.5 t"). Sahadan gelen geri bildirim netti: okunmuyor ve
     ne anlama geldiği anlaşılmıyor. Şimdi gerçek bir gösterge paneli —
     kısaltma yok, her satırın Türkçe etiketi var, ve en üstte momentin kendisi
     hem çubuk hem yüzde hem de tek kelimelik durum olarak duruyor.
  */
  #panel {
    position: fixed; left: 16px; top: 64px; z-index: 10; pointer-events: none;
    width: 268px; max-width: calc(100vw - 32px);
    padding: 14px 16px 12px; border-radius: 4px;
    background: rgba(14, 20, 23, 0.86); border: 1px solid #253038;
    font-family: "IBM Plex Mono", ui-monospace, monospace; color: #C7D1D6;
  }
  #panel .baslik {
    font-size: 11px; letter-spacing: 0.12em; color: #8E9BA2; margin-bottom: 8px;
  }
  #panel .bar {
    position: relative; height: 12px; border-radius: 2px;
    background: #1B2429; overflow: hidden;
  }
  #bar-dolu {
    display: block; height: 100%; width: 0%; background: #5FB07C;
    transition: width 0.12s linear, background-color 0.2s linear;
  }
  /* %100 çizgisi — sınırın nerede olduğu çubuğun üstünde görünsün. */
  .bar-sinir {
    position: absolute; top: 0; bottom: 0; left: 66.7%; width: 2px;
    background: #E2645A; opacity: 0.85;
  }
  #moment-yuzde {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: 30px; line-height: 1.05; margin-top: 6px; color: #5FB07C;
  }
  #moment-durum {
    font-size: 11px; letter-spacing: 0.1em; font-weight: 600; color: #5FB07C;
    margin-bottom: 10px;
  }
  #moment-yuzde[data-zone="amber"], #moment-durum[data-zone="amber"] { color: #E8A62C; }
  #moment-yuzde[data-zone="red"],   #moment-durum[data-zone="red"]   { color: #E2645A; }

  #panel dl {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 10px;
    margin: 0 0 8px; font-size: 12px; border-top: 1px solid #1D262B; padding-top: 9px;
  }
  #panel dt { white-space: nowrap; }
  #panel dd { white-space: nowrap; }
  #panel dt { color: #8E9BA2; margin: 0; }
  #panel dd { margin: 0; text-align: right; font-weight: 600; color: #E4E9EB; }
  #p-ayak[data-state="full"] { color: #5FB07C; }
  #p-ayak[data-state="half"] { color: #E8A62C; }
  #p-egim[data-warn="yes"], #p-halat[data-warn="yes"] { color: #E2645A; }
  /* Sınırı hangi şeyin koyduğu ve halat katı, listenin altında kendi
     satırlarında — grid hücresine sığdırmaya çalışmak etiketleri sarıyordu. */
  #p-alt1, #p-alt2 {
    font-size: 11px; line-height: 1.5; color: #8E9BA2; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #p-alt2 { margin-bottom: 8px; color: #C7D1D6; }
  /* Detay satırlarının açma anahtarı. Panel varsayılan olarak üç satır —
     *"şu an çok detaylı, oyuncular için fazla olabilir."* Kot, eğim, hız gibi
     satırlar `I` ile açılıyor; oyuncunun bunu bilmesi için tek satırlık,
     sessiz bir ipucu yetiyor. */
  #p-detay {
    font-size: 10.5px; letter-spacing: 0.04em; color: #6D777E;
    margin: -4px 0 9px; white-space: nowrap;
  }
  /* Panelin tamamı `pointer-events: none`; dokunmatikte bu tek satır istisna,
     çünkü telefonda `I` tuşu yok. */
  #p-detay.dokunulur {
    pointer-events: auto; cursor: pointer; color: #9FB0BA;
    border: 1px solid #2A343C; border-radius: 4px;
    padding: 5px 8px; margin: 2px 0 9px; display: inline-block;
  }
  #panel dd[data-vurgu="iyi"] { color: #5FB07C; }
  #panel dd[data-vurgu="uyari"] { color: #E8A62C; }
  #panel dd[data-vurgu="kotu"] { color: #E2645A; }

  #hint {
    font-size: 11.5px; line-height: 1.45; color: #8E9BA2;
    border-top: 1px solid #1D262B; padding-top: 9px;
  }
  #hint[data-mode="crane"] { color: #E8A62C; }
  #hint[data-mode="ready"] { color: #5FB07C; font-weight: 600; }

  /* --- uyarı şeridi: fizik sınırına dayanınca ne yapılacağını SÖYLER --- */
  #uyari {
    position: fixed; left: 50%; top: 84px; transform: translateX(-50%);
    z-index: 26; pointer-events: none; text-align: center;
    padding: 12px 22px; border-radius: 4px; max-width: min(34rem, calc(100vw - 32px));
    background: rgba(58, 18, 16, 0.94); border: 1px solid #E2645A;
    font-family: "IBM Plex Mono", ui-monospace, monospace; color: #F3DAD7;
  }
  #uyari[hidden] { display: none; }
  #uyari[data-zone="amber"] {
    background: rgba(58, 42, 12, 0.94); border-color: #E8A62C; color: #F6E6C4;
  }
  #uyari .bas {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: 21px; letter-spacing: 0.03em; line-height: 1.1; color: #E2645A;
  }
  #uyari[data-zone="amber"] .bas { color: #E8A62C; }
  #uyari p { margin: 5px 0 0; font-size: 12.5px; line-height: 1.5; }
  #uyari .cozum { color: #FFFFFF; font-weight: 600; }
  #uyari.carpiyor { animation: uyariNabiz 0.7s ease-in-out infinite; }
  @keyframes uyariNabiz { 50% { opacity: 0.62; } }

  /* --- tuşlar --- */
  #tuslar {
    position: fixed; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 10; pointer-events: none; text-align: right; line-height: 1.85;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; color: #8E9BA2;
    /* Kamera geri çekilince bina buranın altına giriyor ve yazı kayboluyordu. */
    padding: 9px 12px; border-radius: 4px;
    background: rgba(14, 20, 23, 0.8); border: 1px solid #1D262B;
  }
  #tuslar b { color: #E8A62C; font-weight: 600; }
  /* Ekran kumandası açıkken klavye listesi yalan söylüyor. */
  body.dokunmatik #tuslar { display: none; }
  kbd {
    background: #1D262B; border: 1px solid #35434A; border-radius: 3px;
    padding: 1px 5px; color: #E4E9EB; font: inherit; font-size: 11px;
  }

  @container sahne (max-width: 720px) {
    /* Görevin uzun açıklaması dar ekranda satırı taşırıyor; kod, ad ve
       tonaj kalıyor — oyuncunun karar verirken ihtiyacı olan zaten o. */
    #gorev-brif { display: none; }
    #panel { width: 200px; top: 58px; padding: 11px 12px 10px; }
    #moment-yuzde { font-size: 25px; }
    #tuslar { display: none; }
  }

  /* --- ekran üstü kumanda ---
     Telefonda klavye yok. Sol başparmak sürüyor, sağ başparmak çatalı
     işletiyor: gerçek makinedeki el dağılımının aynısı. Kap `pointer-events:
     none`, sadece düğmeler dokunuşu yakalıyor — parmak boşluğa değdiğinde
     kamera değil oyun görüyor. z-index sonuç panelinin (30) ÜSTÜNDE, yoksa
     bölüm bitince telefonda turu kapatmanın yolu kalmıyor. */
  #dokunmatik { position: fixed; inset: 0; z-index: 31; pointer-events: none; }
  #dokunmatik[hidden] { display: none; }
  #dokunmatik .pad { position: absolute; display: flex; gap: 10px; pointer-events: auto; }
  #dokunmatik .pad.sol {
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #dokunmatik .pad.sag {
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  #dokunmatik .pad.yardimci {
    right: calc(14px + env(safe-area-inset-right, 0px));
    top: calc(52px + env(safe-area-inset-top, 0px));
    gap: 8px;
  }
  /* Bölüm bitti: sürüş ve çatal düğmeleri sonuç panelinin önünü kapatmasın. */
  body.bitti #dokunmatik .pad.sol,
  body.bitti #dokunmatik .pad.sag { display: none; }

  #dokunmatik button {
    width: 68px; height: 68px; padding: 0; cursor: pointer;
    display: grid; align-content: center; justify-items: center; gap: 3px;
    background: rgba(18, 25, 30, 0.86); border: 1px solid #35434A;
    border-radius: 12px; color: #E4E9EB;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    touch-action: none; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #dokunmatik button .isaret { font-size: 21px; line-height: 1; color: #E8A62C; }
  /* Çizilmiş simgelerin (ayak, kanca, halat katı) ölçüsü kendilerinde yok:
     satır içi SVG boyutsuz kalınca büzülüp görünmez oluyordu. */
  #dokunmatik button .isaret svg { display: block; width: 21px; height: 21px; }
  /* Etiket SARIYOR, kırpılmıyor: "bağla/bırak" ve İngilizcedeki
     "attach/release" 68 pikselin dışına taşıyordu. Tek satıra zorlamak her
     dil için ayrı ayrı kısaltma uydurmak demekti. */
  #dokunmatik button .ad {
    font-size: 9px; letter-spacing: 0.02em; color: #8E9BA2;
    line-height: 1.15; max-width: 62px; text-align: center;
    /* Son çare: tek parça uzun bir kelime (bir dilde eninde sonunda çıkar)
       düğmeyi taşırmasın. */
    overflow-wrap: anywhere;
  }
  #dokunmatik .pad.yardimci .ad { white-space: nowrap; max-width: none; }
  /* Basılı hâl dolu renkle: parmağın altında kalan düğmede kenarlık değişimi
     görünmüyor. */
  #dokunmatik button.basili { background: #E8A62C; border-color: #E8A62C; }
  #dokunmatik button.basili .isaret,
  #dokunmatik button.basili .ad { color: #16191B; }
  #dokunmatik button:focus-visible { outline: 2px solid #E8A62C; outline-offset: 2px; }
  /* Küçük olan YARDIMCI kümenin düğmeleri, "tek basışlık" olanlar değil:
     vinçte bağla/bırak, halat katı ve ayaklar da tek basışlık ama makinenin
     asıl kumandaları, sürüş düğmeleriyle aynı boyda olmalılar. Genişlik
     içeriğe göre: sabit 52px'te "makineler" kırpılıyordu. */
  #dokunmatik .pad.yardimci button {
    width: auto; min-width: 56px; height: 46px; padding: 0 9px;
    background: rgba(18, 25, 30, 0.7);
  }
  #dokunmatik .pad.yardimci .isaret { font-size: 16px; color: #AEBAC1; }
  #dokunmatik .pad.yardimci .isaret svg { width: 16px; height: 16px; }
  #dokunmatik .pad.yardimci .ad { font-size: 8.5px; }

  /* --- alçak ekran: yatay tutulan telefon ---
     Buradaki dert GENİŞLİK değil YÜKSEKLİK. Yatay bir telefon 844×390 olabiliyor;
     `max-width: 720px` kuralı hiç tutmuyor, oysa 390 piksellik yükseklikte panel
     ekranı aşıyor ve ekran kumandasının üstüne biniyor. Panel buradan itibaren
     kendi kendine küçülüyor: ölçüler, detay açıkken bile pad'in üst kenarının
     üstünde bitecek şekilde seçildi. */
  @container sahne (max-height: 460px) {
    #gorev-brif { display: none; }
    #ust { padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px; font-size: 12px; }
    #panel {
      /* `border-box`: ipucu ve uyarı şeridi panelin sağ kenarından hizalanıyor,
         dolayısıyla `--panel-en` DIŞ genişlik olmalı. İçerik genişliği olarak
         bırakılınca iç boşluk ve kenarlık 24 piksel ekliyordu ve iki şerit de
         panelin üstüne biniyordu. */
      box-sizing: border-box;
      top: 40px; width: var(--panel-en); padding: 8px 9px 6px;
      /* Detay acikken panel yuksekligin %66'sina cikiyordu. Tavan artik
         yarida: ustu kalabiliyorsa kalsin, tasan satirlar kaysin. */
      max-height: min(calc(100% - 134px), 50%); overflow-y: auto;
      scrollbar-width: none;
    }
    #panel::-webkit-scrollbar { display: none; }
    /* **Telefonda panel kucultuldu ve sebebi sahadan geldi:** "sol menu cok
       buyuk gorunuyor ve ekrani kapliyor." Olculdu ve haklıydi — 844x390'lik
       bir cerçevede panel 188x178, yani YUKSEKLIGIN %46'si, detay acikken
       %66'si. Ustelik tam bomun calistigi kosede duruyor.

       Gosterge blogu (baslik + cubuk + yuzde + durum) BOYUTUNU KORUYOR:
       oyuncunun anlik karari o blokta ve kucultmek onu okunmaz yapardi.
       Kazanc satirlardan, bosluklardan ve genislikten cikariliyor. */
    #panel .baslik { font-size: 9.5px; margin-bottom: 5px; letter-spacing: 0.06em; }
    #panel .bar { height: 9px; }
    #moment-yuzde { font-size: 21px; margin-top: 3px; }
    #moment-durum { font-size: 9.5px; margin-bottom: 5px; }
    #panel dl { font-size: 10px; gap: 1px 6px; padding-top: 5px; margin-bottom: 4px; }
    /* Gösterge bloğunun alt açıklamaları: dar ekranda zaten "…" ile
       kesiliyorlardı. Burada bir kez yanlış yapıldı — "aynı bilgi satır
       listesinde" diye gizlendiler, oysa halat katı SADECE burada yazıyordu
       ve telefonda o düğmenin tek açıklaması kayboldu. Şimdi kritik olan
       ikisi başka yerde: sınırı kimin koyduğu her zaman görünen `sınır`
       satırının etiketinde, halat katı ise düğmenin kendi üstünde. */
    #p-alt1, #p-alt2 { display: none; }
    #p-detay { font-size: 9.5px; }

    /* **Panel telefonda SLAB gibi durmasin.** Boyutu kismak tek basina
       yetmedi: 844x390'da ekranin ust seridi (26px) ve kumanda seridi
       (115px) dusunce oynanabilir alan 250 piksel kaliyor ve panel onun
       %62'si. Sayilar kuculdukce bile opak bir dikdortgen sahnenin ustunde
       duruyor. Saydamlik + bulaniklik ayni bilgiyi tasiyip sahneyi
       gostermeye devam ediyor; kenarlik da inceliyor.

       Gosterge blogunun KENDISI degismiyor — oyuncunun anlik karari orada. */
    /* **Bulaniklik PANELIN KENDISINDE olamaz.** Bir kez oyle yazildi ve
       ipucu seridi kayboldu: `backdrop-filter` elemani `position: fixed`
       torunlari icin KAPSAYICI BLOK yapiyor, `#hint` de panelin icinde
       duruyor — `left/right` birden viewport yerine panelin 158 pikseline
       gore cozuldu ve serit 26 piksellik dikey bir sivri haline geldi.
       (Ayni tuzaga zorlanmis yatay kipinde `transform` ile bir kez daha
       dusuldu; notu yukarida.) Sozde-eleman tasiyinca filtre yalniz KENDI
       torunlarini baglıyor, onun da torunu yok. */
    #panel { background: transparent; border-color: rgba(37, 48, 56, 0.75); }
    #panel::before {
      content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 4px;
      background: rgba(14, 20, 23, 0.62);
      backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    }
    /* Detay dugmesi akista kaliyor ama siki: mutlak konumlanip baslik
       satirina alinca "LIFTING MOMENT" iki satira kiriliyor ve kazanilan
       yer geri gidiyordu. */
    #p-detay.dokunulur { padding: 3px 7px; margin: 0 0 4px; font-size: 9px; }
    /* İpucu panelden çıkıyor; panel de bu satırın yüksekliğinden kurtulup
       detay açıkken bile ekrana sığıyor.
       İki yer denendi ve ikisi de tutmadı: başparmak kümelerinin ARASINA
       ortalamak, çünkü sağ küme dört sol küme üç düğme — boşluk simetrik değil
       ve şerit sağdaki düğmelerin altına giriyordu; düğme sırasının ÜSTÜ ise
       390 piksellik bir ekranda oyun alanının tam ortası, şerit makinenin
       üstüne oturuyordu. Doğru yer ÜST: ipucu okunacak bir satır, başparmak
       hedefi değil, ve orada görev başlığının hemen altına düşüyor. Solda
       panel, sağda yardımcı düğmeler; arada kalan yer bir satıra fazlasıyla
       yetiyor. */
    #hint {
      position: fixed; transform: none; margin: 0;
      left: calc(16px + var(--panel-en) + 10px + env(safe-area-inset-left, 0px));
      right: calc(var(--yardimci-en) + env(safe-area-inset-right, 0px));
      top: calc(34px + env(safe-area-inset-top, 0px));
      padding: 6px 12px; text-align: center; font-size: 10.5px;
      border: 1px solid #253038; border-radius: 4px;
      background: rgba(14, 20, 23, 0.86);
    }
    /* Uyarı şeridi ekranın ortasına hizalı; alçak ekranda panelin en kritik
       üç satırının (çatalda / sınır / arka aks) üstüne biniyordu. Tam da
       oyuncunun uyarıyı okurken bakması gereken sayılar onlar. */
    #uyari {
      left: calc(16px + var(--panel-en) + 10px + env(safe-area-inset-left, 0px));
      right: calc(14px + env(safe-area-inset-right, 0px));
      transform: none; max-width: none; top: 86px; padding: 9px 14px;
    }
    #uyari .bas { font-size: 17px; }
    #uyari p { font-size: 11.5px; }
    #dokunmatik button { width: 58px; height: 56px; }
    #dokunmatik button .isaret { font-size: 18px; }
    #dokunmatik .pad.yardimci button { min-width: 50px; height: 38px; padding: 0 7px; }
    #dokunmatik .pad.yardimci { top: calc(38px + env(safe-area-inset-top, 0px)); }
  }

  /* --- dar dikey ekran ---
     Kumanda iki sütuna diziliyor: 390 pikselde iki küme YAN YANA sığmıyor
     (194 + 262), alt alta sığıyor (144 + 144). Düğmeler küçülmüyor, sadece
     sarıyorlar — dokunma hedefini kısmak en son çare.
     Üstüne bir de "yatay tutunca daha iyi" ÖNERİSİ çıkıyor. Bir zamanlar kapı
     olarak yazılmıştı ve sahada kırıldı: artifact bir iframe içinde açılıyor,
     `orientation: portrait` orada ÇERÇEVENİN en-boyunu okuyor, cihazınkini
     değil — telefon çevrilse bile çerçeve dikey kalıyor ve oyun hiç
     başlamıyordu. Artık kapatılabiliyor ve kapatıldığı hatırlanıyor.
     z-index seçim ekranının (40) ALTINDA — makine seçmek dikeyde zaten rahat. */
  @container sahne (orientation: portrait) and (max-width: 560px) {
    #dokunmatik .pad.sol, #dokunmatik .pad.sag {
      display: grid; grid-template-columns: repeat(2, auto); gap: 8px;
    }
    /* TEK KALAN son düğme iki sütunu birden alıyor — yani düğme sayısı tek
       olduğunda. `:last-child` tek başına yazılmıştı ve forkliftin üç
       düğmesinde doğru çalışıyordu; vincin dört düğmelik sol kümesinde
       dördüncüyü de yayıp diziyi 2+1+1'e bozuyordu. */
    #dokunmatik .pad.sol button:nth-child(odd):last-child,
    #dokunmatik .pad.sag button:nth-child(odd):last-child { grid-column: 1 / -1; }

    /* Yardımcı küme dikeyde sağ kenarda SÜTUN oluyor. Yatay dizilince üst
       şeridin üstüne biniyordu; panelin yanına almak da olmuyor, çünkü 390
       pikselde panel (186) ve küme (184) yan yana sığmıyor. Sütun hâlinde
       hem şeridin altında kalıyor hem de panelle çakışmıyor. */
    #dokunmatik .pad.yardimci {
      flex-direction: column; gap: 6px;
      top: calc(78px + env(safe-area-inset-top, 0px));
    }

    /* Panel dikeyde ekranın yarısını yiyordu: üstte panel, altta kumanda,
       arada makineye kalan bir şerit. Aynı sıkıştırma yatay telefondakiyle
       aynı mantık — dikeyde kıt olan yine yükseklik. */
    #panel {
      /* Üst şerit dar ekranda iki satıra sarıyor (makine adı + görev) ve
         panel 50 pikselde onun altına giriyordu. */
      box-sizing: border-box; width: 152px; top: 78px; padding: 8px 9px 6px;
      max-height: 42%; overflow-y: auto; scrollbar-width: none;
    }
    #panel .baslik { font-size: 9.5px; margin-bottom: 5px; letter-spacing: 0.06em; }
    #panel .bar { height: 9px; }
    #moment-yuzde { font-size: 21px; margin-top: 3px; }
    #moment-durum { font-size: 9.5px; margin-bottom: 5px; }
    #panel dl { font-size: 10px; gap: 1px 6px; padding-top: 5px; margin-bottom: 4px; }
    /* Gösterge bloğunun alt açıklamaları: dar ekranda zaten "…" ile
       kesiliyorlardı. Burada bir kez yanlış yapıldı — "aynı bilgi satır
       listesinde" diye gizlendiler, oysa halat katı SADECE burada yazıyordu
       ve telefonda o düğmenin tek açıklaması kayboldu. Şimdi kritik olan
       ikisi başka yerde: sınırı kimin koyduğu her zaman görünen `sınır`
       satırının etiketinde, halat katı ise düğmenin kendi üstünde. */
    #p-alt1, #p-alt2 { display: none; }
    #p-detay { font-size: 9.5px; }

    /* **Panel telefonda SLAB gibi durmasin.** Boyutu kismak tek basina
       yetmedi: 844x390'da ekranin ust seridi (26px) ve kumanda seridi
       (115px) dusunce oynanabilir alan 250 piksel kaliyor ve panel onun
       %62'si. Sayilar kuculdukce bile opak bir dikdortgen sahnenin ustunde
       duruyor. Saydamlik + bulaniklik ayni bilgiyi tasiyip sahneyi
       gostermeye devam ediyor; kenarlik da inceliyor.

       Gosterge blogunun KENDISI degismiyor — oyuncunun anlik karari orada. */
    /* **Bulaniklik PANELIN KENDISINDE olamaz.** Bir kez oyle yazildi ve
       ipucu seridi kayboldu: `backdrop-filter` elemani `position: fixed`
       torunlari icin KAPSAYICI BLOK yapiyor, `#hint` de panelin icinde
       duruyor — `left/right` birden viewport yerine panelin 158 pikseline
       gore cozuldu ve serit 26 piksellik dikey bir sivri haline geldi.
       (Ayni tuzaga zorlanmis yatay kipinde `transform` ile bir kez daha
       dusuldu; notu yukarida.) Sozde-eleman tasiyinca filtre yalniz KENDI
       torunlarini baglıyor, onun da torunu yok. */
    #panel { background: transparent; border-color: rgba(37, 48, 56, 0.75); }
    #panel::before {
      content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 4px;
      background: rgba(14, 20, 23, 0.62);
      backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    }
    /* Detay dugmesi akista kaliyor ama siki: mutlak konumlanip baslik
       satirina alinca "LIFTING MOMENT" iki satira kiriliyor ve kazanilan
       yer geri gidiyordu. */
    #p-detay.dokunulur { padding: 3px 7px; margin: 0 0 4px; font-size: 9px; }
    #hint { font-size: 10.5px; padding-top: 7px; }
    /* Uyarı şeridi dar ekranda kenarlara yapışmasın. */
    #uyari { left: 12px; right: 12px; transform: none; max-width: none; }
  }

  #cevir { display: none; }
  @media (pointer: coarse) and (orientation: portrait) and (max-width: 560px) {
    #cevir {
      position: fixed; inset: 0; z-index: 35;
      display: grid; align-content: center; justify-items: center; gap: 16px;
      padding: 32px; text-align: center; background: #0E1417;
      font-family: "IBM Plex Mono", ui-monospace, monospace; color: #8E9BA2;
    }
    #cevir .simge {
      width: 38px; height: 61px; color: #E8A62C;
      animation: cevirSallan 2.4s ease-in-out infinite;
    }
    #cevir .bas {
      font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
      font-size: 26px; letter-spacing: 0.06em; color: #E8A62C;
    }
    #cevir p { margin: 0; font-size: 12.5px; line-height: 1.6; max-width: 20rem; }
    #cevir .secenekler { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap;
      justify-content: center; }
    #cevir .secenekler button {
      font: inherit; font-size: 12px; cursor: pointer; border-radius: 4px;
      padding: 10px 18px; font-weight: 600; letter-spacing: 0.03em;
    }
    /* Yatay ÖNERİLEN yol, o yüzden dolu; dikey de tam anlamıyla oynanıyor,
       o yüzden zayıf değil sadece sakin. */
    #cevir button.yatay { background: #E8A62C; border: none; color: #16191B; }
    #cevir button.yine {
      background: transparent; border: 1px solid #3B4750; color: #C7D1D6;
    }
    #cevir .secenekler button:focus-visible {
      outline: 2px solid #E4E9EB; outline-offset: 2px;
    }
    /* Bir kez kapatıldı: bu oyuncu ya çeviremiyor ya da istemiyor. */
    body.cevir-kapali #cevir { display: none; }
  }
  @keyframes cevirSallan {
    0%, 55%, 100% { transform: rotate(0deg); }
    72%, 88% { transform: rotate(-90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #cevir .simge { animation: none; }
  }

  /* --- yerleştirme onay paneli --- */
  #kondu {
    position: fixed; left: 50%; top: 26%; transform: translateX(-50%);
    z-index: 25; pointer-events: none; text-align: center; padding: 18px 26px;
    background: rgba(14, 20, 23, 0.94); border: 1px solid #2C7A52; border-radius: 4px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; color: #E4E9EB;
    min-width: 17rem; max-width: calc(100vw - 32px);
    animation: konduGir 0.22s ease-out;
  }
  #kondu[hidden] { display: none; }
  @keyframes konduGir {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  #kondu .tik {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: 1.7rem; color: #5FB07C; letter-spacing: 0.04em;
    text-transform: uppercase; line-height: 1;
  }
  #kondu .ad { font-size: 13px; color: #E8A62C; margin-top: 6px; font-weight: 600; }
  #kondu .kazanc {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: 30px; line-height: 1.1; color: #5FB07C; margin-top: 4px;
  }
  #kondu dl {
    display: grid; grid-template-columns: auto auto; gap: 3px 16px;
    margin: 12px 0 0; font-size: 12px; justify-content: center;
  }
  #kondu dt { color: #8E9BA2; text-align: left; margin: 0; }
  #kondu dd { margin: 0; text-align: right; font-weight: 600; }
  #kondu dd[data-iyi="evet"] { color: #5FB07C; }
  #kondu dd[data-iyi="hayir"] { color: #E8A62C; }
  #kondu .sonraki { font-size: 11px; color: #6C7C84; margin: 10px 0 0; }

  /* --- sonuç paneli --- */
  #sonuc {
    position: fixed; inset: 0; z-index: 30; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(14, 20, 23, 0.92);
    font-family: "IBM Plex Mono", ui-monospace, monospace; color: #E4E9EB;
  }
  #sonuc[hidden] { display: none; }
  #sonuc-ic { text-align: center; max-width: 30rem; width: 100%; }
  #sonuc-ic h2 {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: clamp(1.6rem, 6vw, 2.4rem); margin: 4px 0 14px; letter-spacing: 0.02em;
    text-transform: uppercase; color: #E8A62C;
  }
  #sonuc-ic .not {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: clamp(4rem, 18vw, 7rem); line-height: 1; color: #5FB07C;
  }
  #sonuc-ic .not[data-not="B"] { color: #9FC46B; }
  #sonuc-ic .not[data-not="C"] { color: #E8A62C; }
  #sonuc-ic .not[data-not="D"] { color: #E2645A; }
  #sonuc-ic .rozet {
    display: inline-block; border: 1px solid #E8A62C; color: #E8A62C;
    border-radius: 3px; padding: 4px 14px; letter-spacing: 0.12em;
    font-size: 12px; font-weight: 600; margin: 0 0 14px;
  }
  #sonuc-ic table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #sonuc-ic td { padding: 5px 0; border-bottom: 1px solid #1D262B; }
  #sonuc-ic td:first-child { text-align: left; color: #8E9BA2; }
  #sonuc-ic td:last-child { text-align: right; font-weight: 600; }
  #sonuc-ic .toplam {
    font-family: "Barlow Condensed", Impact, sans-serif; font-weight: 700;
    font-size: 34px; line-height: 1.1; color: #E8A62C; margin: 0 0 12px;
  }
  /* --- ara süreler ---
     Speedrun tablosu: görev, parça süresi, tur toplamı, rekora fark.
     Sayılar `tabular-nums` ile hizalı — kolon kolon okunacak bir şey. */
  #sonuc-ic .ara-sureler { margin-top: 16px; }
  #sonuc-ic .ara-sureler h3 {
    font-size: 11px; letter-spacing: 0.12em; color: #6D777E;
    margin: 0 0 6px; font-weight: 600;
  }
  #sonuc-ic .ara-sureler table { font-variant-numeric: tabular-nums; }
  #sonuc-ic .ara-sureler td { padding: 3px 0; }
  #sonuc-ic .ara-sureler td:first-child { color: #E8A62C; font-weight: 600; }
  #sonuc-ic .ara-sureler td:nth-child(2) { text-align: right; color: #C7D1D6; }
  #sonuc-ic .ara-sureler td:nth-child(3) { text-align: right; color: #8E9BA2; }
  #sonuc-ic .ara-sureler td:last-child { text-align: right; font-weight: 600; }
  #sonuc-ic .ara-sureler td[data-iyi="evet"] { color: #5FB07C; }
  #sonuc-ic .ara-sureler td[data-iyi="hayir"] { color: #E2645A; }
  #sonuc-ic .ara-sureler td[data-iyi="esit"] { color: #6D777E; }
  #sonuc-ic .ara-sureler .ilk {
    margin: 8px 0 0; font-size: 11px; color: #6D777E;
  }

  /* Yerleştirme panelindeki tur toplamı + fark. */
  #kondu .ara {
    margin: 10px 0 0; font-size: 12px; color: #8E9BA2;
    font-variant-numeric: tabular-nums;
  }
  #kondu .ara b { font-weight: 600; margin-left: 6px; }
  #kondu .ara b[data-iyi="evet"] { color: #5FB07C; }
  #kondu .ara b[data-iyi="hayir"] { color: #E2645A; }
  #kondu .ara b[data-iyi="esit"] { color: #8E9BA2; }

  #sonuc-ic .puan { font-size: 14px; color: #8E9BA2; margin: 14px 0 4px; }
  #sonuc-ic .note { font-size: 11px; color: #6C7C84; margin: 0; }
  /* Rekor kırılınca söylenir, kırılmayınca hedef gösterilir: ikisi de aynı
     yerde, biri diğerinin yerine. */
  #sonuc-ic .rekor {
    display: inline-block; background: #E8A62C; color: #16191B;
    border-radius: 3px; padding: 4px 14px; letter-spacing: 0.12em;
    font-size: 12px; font-weight: 700; margin: 0 0 12px;
  }
  #sonuc-ic .onceki { font-size: 12px; color: #6C7C84; margin: 0 0 12px; }

  /* --- açılış: araç seçimi ---
     Oyun bir ayar menüsüyle değil, bir KARARLA başlıyor: hangi makine.
     Kartlar makineyi tanıtıyor ve neyin zor olduğunu söylüyor, çünkü iki araç
     aynı oyunu oynamıyor — biri yarıçapla, diğeri yük merkeziyle sınırlı. */
  #secim {
    position: fixed; inset: 0; z-index: 40; overflow-y: auto;
    background:
      radial-gradient(120% 90% at 50% -10%, #223039 0%, #0E1417 62%);
    font-family: "IBM Plex Mono", ui-monospace, monospace; color: #C7D1D6;
    display: grid; place-items: center; padding: 24px 16px;
  }
  #secim[hidden] { display: none; }
  .secim-ic { width: min(1040px, 100%); }
  /* Dil düğmeleri açılış ekranında duruyor: bütün metinler oyun başlarken bir
     kez okunuyor, dolayısıyla dili değiştirmenin tek doğru anı burası. */
  #secim .diller {
    display: flex; justify-content: center; gap: 6px; margin-bottom: 18px;
  }
  #secim button.dil {
    font: inherit; font-size: 11.5px; letter-spacing: 0.04em; cursor: pointer;
    background: #171E22; border: 1px solid #2A343A; color: #8E9BA2;
    border-radius: 3px; padding: 5px 13px;
  }
  #secim button.dil:hover { border-color: #3B4750; color: #C7D1D6; }
  #secim button.dil.secili {
    background: #E8A62C; border-color: #E8A62C; color: #16191B; font-weight: 600;
  }
  #secim button.dil:focus-visible { outline: 2px solid #E8A62C; outline-offset: 2px; }
  #secim header { text-align: center; margin-bottom: 28px; }
  #secim h1 {
    font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 44px;
    letter-spacing: 0.1em; color: #E8A62C; margin: 0 0 6px;
  }
  #secim header p { margin: 0; color: #8E9BA2; font-size: 14px; }
  #secim .kartlar {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fit, minmax(258px, 1fr));
  }
  #secim .kart {
    position: relative; text-align: left; cursor: pointer;
    background: #161D23; border: 1px solid #2A343C; border-radius: 12px;
    padding: 18px 18px 16px; color: inherit; font: inherit;
    transition: border-color .14s, transform .14s, background .14s;
  }
  #secim .kart:hover:not([disabled]) {
    border-color: #E8A62C; background: #1B242B; transform: translateY(-2px);
  }
  #secim .kart:focus-visible { outline: 2px solid #E8A62C; outline-offset: 2px; }
  #secim .kart[disabled] { opacity: .42; cursor: not-allowed; }
  #secim .simge { color: #E8A62C; height: 56px; margin-bottom: 10px; }
  #secim .kart[disabled] .simge { color: #6D777E; }
  #secim .simge svg { height: 100%; width: auto; }
  #secim .kart h2 {
    font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 23px;
    margin: 0; letter-spacing: 0.04em; color: #E4E9EB;
  }
  #secim .sinif { color: #8E9BA2; font-size: 11.5px; margin: 2px 0 10px; }
  #secim .kart p { margin: 0 0 12px; font-size: 12.5px; line-height: 1.55; color: #AEBAC1; }
  #secim .zorluk {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; color: #7C878E; text-transform: uppercase; letter-spacing: .08em;
  }
  #secim .noktalar { display: flex; gap: 4px; }
  #secim .noktalar i {
    width: 8px; height: 8px; border-radius: 50%; background: #2F3A42; display: block;
  }
  #secim .noktalar i.dolu { background: #E8A62C; }
  /* Karttaki en iyi derece. Zorluk ipucundan bir çizgiyle ayrılıyor: biri
     makineyi tanıtıyor, diğeri oyuncunun kendi geçmişi. */
  #secim .en-iyi {
    margin-top: 9px; padding-top: 9px; border-top: 1px solid #222B31;
    font-size: 11.5px; letter-spacing: 0.02em; color: #5FB07C;
  }
  #secim .en-iyi[data-not="B"] { color: #9FC46B; }
  #secim .en-iyi[data-not="C"] { color: #E8A62C; }
  #secim .en-iyi[data-not="D"] { color: #B08A6A; }
  #secim .klavye {
    font-size: 11px; color: #E8A62C; margin: -6px 0 10px; letter-spacing: 0.02em;
  }
  #secim .ipucu {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid #242E35;
    font-size: 11.5px; color: #7C878E; line-height: 1.5;
  }
  #secim .rozet {
    position: absolute; top: 12px; right: 12px; font-size: 10px;
    letter-spacing: .08em; text-transform: uppercase;
    background: #2A343C; color: #AEBAC1; border-radius: 99px; padding: 3px 9px;
  }
  #secim .rozet.son { background: #E8A62C; color: #16191B; }
  /* --- kumanda kipi ---
     Kartların altında, ayrı bir şerit. Dil düğmeleriyle aynı görsel dil
     (küçük, sakin, seçili olan amber dolu) ama kendi başlığı var, çünkü
     "Temel/Gelişmiş" tek başına ne olduğunu söylemiyor. */
  /* --- Tam Tur şeridi ---
     Kart değil şerit: Tam Tur dördüncü bir makine değil, üçünün birden
     oynandığı bir kip. Kart yapmak "hangi makine" sorusunu bulandırırdı. */
  #secim .tam-tur-serit {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-top: 16px; padding: 14px 18px; border-radius: 10px;
    background: linear-gradient(90deg, #1B2A22, #161D23 60%);

    margin: 2px 0 0; font-size: 12px; line-height: 1.5; color: #AEBAC1;

  #secim .tur-rekor {
    display: inline-block; margin-top: 7px; font-size: 11.5px;

  #secim .tur-rekor[data-not="C"] { color: #E8A62C; }
  #secim .tur-rekor[data-not="D"] { color: #B08A6A; }

    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
    cursor: pointer; border: none; border-radius: 6px; padding: 12px 22px;

  }

  #secim button.tam-tur:focus-visible { outline: 2px solid #5FB07C; outline-offset: 2px; }
