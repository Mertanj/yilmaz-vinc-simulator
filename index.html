<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D98A0B">
<title>Yılmaz Vinç</title>
<meta name="description" content="Yılmaz Vinç mobil vinç simülasyonu. Tarayıcıda hemen oyna.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html { overscroll-behavior: none; }
  html, body { margin: 0; height: 100%; background: #0E1417; overflow: hidden; }
  body, #game {
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
             12px calc(16px + env(safe-area-inset-left, 0px));
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; color: #C7D1D6; pointer-events: none;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  #hud b { color: #E8A62C; font-weight: 600; }
  .keys { text-align: right; line-height: 1.7; }
  kbd {
    background: #1D262B; border: 1px solid #35434A; border-radius: 3px;
    padding: 1px 5px; color: #E4E9EB; font: inherit; font-size: 11px;
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div><b>YILMAZ VİNÇ</b> · sprint 1 · sürüş &nbsp;·&nbsp; <span id="speed">0 km/sa</span></div>
    <div class="keys">
      <kbd>→</kbd> gaz &nbsp; <kbd>←</kbd> geri &nbsp; <kbd>boşluk</kbd> el freni &nbsp; <kbd>R</kbd> sıfırla
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
